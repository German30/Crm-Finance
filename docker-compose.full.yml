# =============================================================================
# Meridian — pila completa (MySQL + API + frontend)
#
#   cp .env.example .env        # y cambia las claves
#   docker compose -f docker-compose.full.yml up -d --build
#
# TRES servicios:
#
#   crm-web    ->  http://localhost:4200    la aplicacion
#   crm-api    ->  http://localhost:5170    Swagger en /swagger
#   crm-mysql  ->  localhost:3307           usuario root, clave en .env
#
# La API se construye desde el repositorio del backend, que se espera al lado de
# este. Si esta en otro sitio, cambia BACKEND_PATH en el .env.
#
# Esta pila SUSTITUYE al docker-compose del backend: levanta su mismo MySQL y su
# misma API. Si ya lo tienes arriba, bajalo antes o chocaran por los puertos:
#   docker compose -p crmfinaciertobackend down
#
# Los contenedores NO llevan container_name a proposito: asi Compose los nombra
# por proyecto (crm-frontend-api-1, ...) y nunca chocan por nombre con los del
# backend.
#
# Aqui el frontend NO habla con el anfitrion: reenvia /api directamente al
# contenedor `api` por la red interna. El navegador solo ve el origen del
# frontend, asi que CORS no interviene en ningun momento.
#
# OJO: los scripts de /docker-entrypoint-initdb.d solo corren con el directorio de
# datos VACIO. Si cambias el esquema, hay que recrear el volumen:
#   docker compose -f docker-compose.full.yml down -v && ... up -d --build
# =============================================================================

services:

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${CRM_APP_USER}
      MYSQL_PASSWORD: ${CRM_APP_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - crm-mysqldata:/var/lib/mysql
      - ${BACKEND_PATH:-../CRMFinaciertoBackend}/database/mysql/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ${BACKEND_PATH:-../CRMFinaciertoBackend}/database/mysql/00_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - ${BACKEND_PATH:-../CRMFinaciertoBackend}/docker/mysql/02_permisos_app.sh:/docker-entrypoint-initdb.d/02_permisos_app.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: ${BACKEND_PATH:-../CRMFinaciertoBackend}
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=crm_finance;User Id=${CRM_APP_USER};Password=${CRM_APP_PASSWORD};"
      Database__MySqlVersion: "8.4.0-mysql"

      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-http://localhost:5170}
      JwtSettings__Audience: ${JWT_AUDIENCE:-http://localhost:4200}

      # El navegador nunca llama a la API directamente (todo pasa por el proxy del
      # frontend), asi que CORS no hace falta para la aplicacion. Se deja
      # configurado igualmente para quien pruebe la API desde Swagger u otro
      # origen.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "${API_PORT:-5170}:8080"
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Por nombre de servicio y puerto INTERNO (8080), no por el publicado: el
      # trafico no sale de la red de Docker.
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  crm-mysqldata:
